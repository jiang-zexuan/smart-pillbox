; PlatformIO 项目配置 — 智能药盒 STM32F103C8T6

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

; === 编译与调试 ===
build_type = debug
; debug: -Og -g   开发阶段保留调试信息
; release: -Os    发布时缩小体积

; === 串口监控 ===
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; === 烧录/调试（ST-Link V2） ===
upload_protocol = stlink
debug_tool = stlink
